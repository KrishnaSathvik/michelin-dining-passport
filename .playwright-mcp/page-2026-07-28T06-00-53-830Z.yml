      - region [ref=e92]:
        - paragraph [ref=e93]: The experience
        - heading "About Kasama" [level=2] [ref=e94]
        - paragraph [ref=e95]: "Opened in 2020 by chef-partners Genie Kwon and Tim Flores, Kasama made history as the first Filipino restaurant in the United States to earn a Michelin star — and now holds two. In Chicago's West Town it leads a deliberate double life: a counter-service bakery by day, turning out Filipino pastries and breakfast plates, and a reservation-only tasting menu by night. Kwon's acclaimed pastry work and Flores's savory cooking drive the $325 dinner, with wine or non-alcoholic pairings, which has also earned a James Beard Award and a place among North America's 50 Best. Equal parts neighborhood bakery and long-planned destination, it rewards a casual morning pastry as much as a milestone dinner."
        - paragraph [ref=e96]: Written by Orellin from public reporting; not affiliated with or copied from the Michelin Guide.
